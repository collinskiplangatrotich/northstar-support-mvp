<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northstar Retail Support</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Northstar Retail Support</h1>
            <p>Welcome! How can we help you today?</p>
        </header>

        <!-- Track My Order Section -->
        <div class="section">
            <h2>📦 Track My Order</h2>
            <div class="input-group">
                <input type="text" id="orderNumber" placeholder="Enter Order Number (e.g., NSL12345)">
                <button type="button" onclick="checkOrderStatus()">Check Order Status</button>
            </div>
            <div id="result" class="result"></div>
        </div>

        <!-- Returns & Refunds Section -->
        <div class="section">
            <h2>🔄 Returns & Refunds</h2>

            <!-- Primary Selector -->
            <div class="input-group">
                <label for="requestType"><strong>Select Service:</strong></label>
                <select id="requestType" onchange="toggleSubOptions()">
                    <option value="">-- Choose Return or Refund --</option>
                    <option value="return">Option 1: Return an Item</option>
                    <option value="refund">Option 2: Request / Check Refund</option>
                </select>
            </div>

            <!-- Conditional Sub-Menu: Return Options -->
            <div id="returnOptionsGroup" class="input-group" style="display: none; margin-top: 15px;">
                <label for="returnReason"><strong>Select Reason for Return:</strong></label>
                <select id="returnReason">
                    <option value="">-- Select Return Reason --</option>
                    <option value="damaged">Item arrived damaged/defective</option>
                    <option value="wrong_size">Wrong size or fit issue</option>
                    <option value="changed_mind">Changed my mind</option>
                </select>
            </div>

            <!-- Conditional Sub-Menu: Refund Options -->
            <div id="refundOptionsGroup" class="input-group" style="display: none; margin-top: 15px;">
                <label for="refundOption"><strong>Select Refund Type:</strong></label>
                <select id="refundOption">
                    <option value="">-- Select Refund Option --</option>
                    <option value="status">Check Status of Ongoing Refund</option>
                    <option value="store_credit">Instant Store Credit Voucher</option>
                    <option value="original_payment">Refund to Original Payment Method</option>
                </select>
            </div>

            <button type="button" onclick="submitReturnOrRefund()" style="margin-top: 15px;">Submit Request</button>
            <div id="returnResult" class="result"></div>
        </div>

        <footer>
            © 2026 Northstar Retail Co. | Support Deflection MVP
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
